services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inkwell
      MYSQL_USER: inkwell
      MYSQL_PASSWORD: inkwell
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Inkwell
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: inkwell
      DB_USERNAME: inkwell
      DB_PASSWORD: inkwell
      ADMIN_EMAIL: admin@inkwell.test
      ADMIN_PASSWORD: password
      SESSION_NAME: inkwell_session
    ports:
      - "8083:80"
    volumes:
      - ./:/var/www/html

volumes:
  db_data:
